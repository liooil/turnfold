name: Release portable runtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate packaging scripts
        shell: pwsh
        run: ./packaging/validate.ps1

      - name: Test and build web application
        run: |
          bun test
          bun run build

      - name: Test and lint Rust runtime
        run: |
          cargo test -p turnfold
          cargo clippy -p turnfold --all-targets -- -D warnings
          cargo fmt --all -- --check

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build portable runtime
        run: |
          bun run build
          cargo build --release -p turnfold --target ${{ matrix.target }}

      - name: Assemble archive
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "turnfold").version
          ./packaging/package-release.ps1 -Target "${{ matrix.target }}" -Version $version

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: turnfold-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: turnfold-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
